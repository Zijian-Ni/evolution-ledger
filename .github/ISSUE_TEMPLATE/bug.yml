name: 🐛 Bug Report
description: Something isn't working correctly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the sections below.
        
        **Hard constraints**: Evolution Ledger is local-first, zero-telemetry, zero runtime deps (CLI).
        If you're unsure whether something is a bug, open a Discussion first.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "When I run `eledger verify ledger.jsonl`, it returns CHAIN_BROKEN even though I never modified the file..."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. Run `eledger init ledger.jsonl`
        2. Run `eledger append --type note --title test`
        3. Run `eledger verify ledger.jsonl`
        4. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      placeholder: "Expected VERIFIED_LOCAL_ONLY, got CHAIN_BROKEN"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Evolution Ledger version
      placeholder: "0.4.0"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "v22.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Linux
        - macOS
        - Windows (WSL)
        - Windows (native)
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Paste any relevant CLI output or error messages.
      render: shell
